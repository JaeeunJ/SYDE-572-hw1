<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" preserveAspectRatio="xMidYMid meet">
  <rect width="600" height="450" fill="#ffffff"/>
  <path d="M70 350 L550 350 M70 70 L70 350" stroke="#e5e7eb" stroke-width="2"/>
  <path d="M70 280 L550 280 M70 210 L550 210 M70 140 L550 140 M70 70 L550 70" stroke="#f3f4f6" stroke-width="1"/>
  <path d="M190 70 L190 350 M310 70 L310 350 M430 70 L430 350 M550 70 L550 350" stroke="#f3f4f6" stroke-width="1"/>

  <text x="310" y="35" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#1f2937">Newton-Raphson Iterations</text>
  <text x="310" y="390" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#6b7280">Iteration Number</text>
  <text x="30" y="210" font-family="sans-serif" font-size="14" text-anchor="middle" transform="rotate(-90 30 210)" fill="#6b7280">Optimal x* Value</text>

  <g font-family="sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">
    <text x="70" y="365">0</text>
    <text x="190" y="365">1</text>
    <text x="310" y="365">2</text>
    <text x="430" y="365">3</text>
    <text x="550" y="365">4</text>
  </g>

  <polyline points="70,350 190,140 310,122 430,120 550,120" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <g fill="#1f2937">
    <circle cx="70" cy="350" r="5"/>
    <circle cx="190" cy="140" r="5"/>
    <circle cx="310" cy="122" r="5"/>
    <circle cx="430" cy="120" r="5"/>
    <circle cx="550" cy="120" r="5"/>
  </g>
</svg>
